<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Explore Hatta — Kiosk (landscape)</title>
  <meta name="description" content="Interactive map of Hatta for web and kiosk — Wild Camel HyperMedia prototype for Dubai Culture.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest-kiosk.webmanifest">
  <meta name="theme-color" content="#FFFDF9">
  <meta name="application-name" content="Explore Hatta">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hatta Kiosk">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
  <link rel="shortcut icon" href="assets/icons/favicon.ico">
  <link rel="stylesheet" href="map.css">
  <style>
    /* Demo page shell only — the component itself is fully scoped under #hatta-map-widget */
    html, body { margin: 0; height: 100%; background: #F4EADB; }
    #hatta-map-widget { height: 100vh; height: 100dvh; }
  </style>
</head>
<body>
  <!-- Kiosk entry page: landscape by default (add to a tablet home screen for a demo); the ?switches still work -->
  <div id="hatta-map-widget" data-lang="en" dir="ltr"></div>

  <!-- data/pois.js makes the prototype work from file:// (kiosk); map.js falls back to fetch(dataUrl) without it -->
  <script src="data/pois.js"></script>
  <script src="map.js"></script>
  <script>
    (function () {
      // Demo switches via URL:  ?mode=kiosk|web  &orientation=auto|landscape|portrait  &lang=en|ar  &landing=0  &idle=60  &art=clean|print
      var q = {};
      window.location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
        if (!kv) return; var p = kv.split('='); q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
      });
      window.HattaMap.init({
        container: '#hatta-map-widget',
        mode: q.mode === 'web' ? 'web' : 'kiosk',
        orientation: q.orientation || 'landscape',
        lang: q.lang || 'en',
        showLangToggle: true,
        showLanding: q.landing !== '0',
        idleSeconds: q.idle ? parseInt(q.idle, 10) : 75,
        dataUrl: 'data/pois.json',
        artwork: q.art === 'print' ? 'print' : 'clean',
        assetsBase: ''
      });
    })();
  </script>
</body>
</html>
